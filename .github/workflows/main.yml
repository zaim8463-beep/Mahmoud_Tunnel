name: Build Mahmoud Tunnel APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find . -type f -iname 'mahmoud-tunnel-0.9.37-source.zip' -print -quit)"
          if [ -z "$archive" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$archive" -d extracted
          project="$(find extracted -name settings.gradle.kts -printf '%h\n' | head -n1)"
          if [ -z "$project" ]; then
            project="$(find extracted -name settings.gradle -printf '%h\n' | head -n1)"
          fi
          if [ -z "$project" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$project" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mahmoud-tunnel-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
